aid: usebraintrust
name: Braintrust (Talent Network)
description: >-
  Braintrust (usebraintrust.com) is an AI-powered talent network and hiring
  platform founded in 2018 in San Francisco. It runs three enterprise
  products: Braintrust AIR, conversational AI interview software with
  semantic resume scoring and a third-party-audited bias posture; the Talent
  Marketplace, a network of 2M+ vetted professionals across engineering, ML,
  data science, design, and finance with zero agency markup; and Braintrust
  Nexus, enterprise workflow automation. The network is governed in part by
  the BTRST token, and its public Network Stats dashboard is backed by an
  open, unauthenticated JSON API captured in this profile. Distinct from
  braintrust.dev, the AI evaluation platform.
